<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F8F5F1" id="theme-color-meta" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="apple-status-bar-meta" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>Reharth Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
    (function () {
      try {
        const storedTheme = localStorage.getItem('reharth-theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = storedTheme === 'dark' || ((!storedTheme || storedTheme === 'system') && systemDark);
        
        const root = document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.style.colorScheme = 'dark';
        } else {
          root.classList.remove('dark');
          root.style.colorScheme = 'light';
        }

        const themeColor = isDark ? '#000000' : '#F8F5F1';
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', themeColor);
        }
        const appleMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (appleMeta) {
          appleMeta.setAttribute('content', isDark ? 'black-translucent' : 'default');
        }
      } catch (e) {}
    })();
  </script>
  <!-- Import Google Fonts: EB Garamond (Serif) and Instrument Sans (Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
    }

    html.dark {
      color-scheme: dark;
    }

    body,
    html,
    #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F8F5F1;
      /* Warm Off-White from reference */
      font-family: 'Instrument Sans', sans-serif;
    }

    html.dark body,
    html.dark html,
    html.dark #root {
      background-color: #000000;
      color: #F5F5F4;
    }

    /* Safe area utilities */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px);
    }

    .safe-area-pb {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .safe-area-pt {
      padding-top: env(safe-area-inset-top, 0px);
    }

    h1,
    h2,
    h3,
    .font-serif {
      font-family: 'EB Garamond', serif;
    }

    /* Smooth scrolling for reader */
    .reader-scroll {
      -webkit-overflow-scrolling: touch;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.33.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.5.0",
    "three": "https://esm.sh/three@^0.182.0",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7",
    "@react-spring/three": "https://esm.sh/@react-spring/three@^10.0.3"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
